services:
  # =========================================================================
  # SHD M Supply System: Admin Dashboard (Client Web SPA)
  # =========================================================================
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shd-admin-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Configurable API URL injected at runtime into /config.js
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3001}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Asia/Bangkok}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

